<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body {
            background-color: #e5e7eb;
            background: linear-gradient(135deg, #f3f4f6, #d1d5db);
        }

        h1 {
            text-align: center;
        }

        form {
            width: 460px;
        }

        label {
            display: inline-block;
            width: 140px;
            vertical-align: top;
        }

        input:not([type="submit"]),
        select,
        textarea {
            box-sizing: border-box;
            width: 280px;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }
    </style>
</head>
<body>
    <h1>Student Registration Form</h1>

    <form>
        <label for="name">Name:</label>
        <input id="name" name="name" type="text" required>
        <br><br>

        <label for="roll-number">Roll Number:</label>
        <input id="roll-number" name="roll-number" type="text" required>
        <br><br>

        <label for="father-name">Father's Name:</label>
        <input id="father-name" name="father-name" type="text" required>
        <br><br>

        <label for="date-of-birth">Date of Birth:</label>
        <input id="date-of-birth" name="date-of-birth" type="date" required>
        <br><br>

        <label for="mobile-number">Mobile Number:</label>
        <input id="mobile-number" name="mobile-number" type="tel" autocomplete="tel" required>
        <br><br>

        <label for="email">Email ID:</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input id="password" name="password" type="password" required>
        <br><br>

        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="" disabled selected>Select your gender</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
            <option value="other">Other</option>
            <option value="prefer-not-to-say">Prefer not to say</option>
        </select>
        <br><br>

        <label for="department">Department:</label>
        <select id="department" name="department" required>
            <option value="" disabled selected>Select your department</option>
            <option value="computer-science">Computer Science</option>
            <option value="information-technology">Information Technology</option>
            <option value="electronics">Electronics</option>
            <option value="mechanical">Mechanical</option>
            <option value="civil">Civil</option>
        </select>
        <br><br>

        <label for="course">Course:</label>
        <select id="course" name="course" required>
            <option value="" disabled selected>Select your course</option>
            <option value="btech">B.Tech</option>
            <option value="be">B.E.</option>
            <option value="bca">BCA</option>
            <option value="mca">MCA</option>
            <option value="bsc">B.Sc.</option>
        </select>
        <br><br>

        <label for="city">City:</label>
        <select id="city" name="city" required>
            <option value="" disabled selected>Select your city</option>
            <option value="delhi">Delhi</option>
            <option value="mumbai">Mumbai</option>
            <option value="bangalore">Bangalore</option>
            <option value="chennai">Chennai</option>
            <option value="kolkata">Kolkata</option>
            <option value="other">Other</option>
        </select>
        <br><br>

        <label for="address">Address:</label>
        <textarea id="address" name="address" required></textarea>
        <br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
